[project]
name = "xetead-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gspread>=6.2.1",
    "mastodon-py>=2.2.2",
    "optional>=0.0.1",
    "pillow>=11.0.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "regex>=2026.7.19",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["battle*", "bots*", "spreadsheets*", "story*", "utils*"]

[tool.ruff]
[tool.ruff.lint]
# ruff 0.16.0부터 설정 없이 두면 기본 활성 규칙이 59개에서 413개로
# 대폭 확장된다(E4/E7/E9/F만 켜져 있던 예전 기본값이 사라짐 —
# https://astral.sh/blog/ruff-v0.16.0). 의도치 않게 전체 규칙셋으로
# 넘어가지 않도록 예전과 동일한 범위(E4, E7, E9, F)로 명시 고정한다.
select = ["E4", "E7", "E9", "F"]
[tool.ruff.format]

[tool.mypy]
mypy_path = "app"
files = ["app"]
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# pymupdf(fitz)는 stub/py.typed 마커가 없는 서드파티 패키지라 타입 검사
# 대상에서 제외한다 — 우리 코드 자체의 타입 검사는 계속 적용된다.
[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["app"]
addopts = ["-v", "--tb=short"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-regex>=2026.7.19.20260720",
]
